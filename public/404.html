<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      ;(() => {
        const redirectPath = window.location.pathname + window.location.search + window.location.hash
        sessionStorage.setItem('spa_redirect_path', redirectPath)
        window.location.replace('/')
      })()
    </script>
  </head>
  <body></body>
</html>
